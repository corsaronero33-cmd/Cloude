# Dati del negozio e formato dell'etichetta.
#
# Le righe che iniziano con il cancelletto sono commenti.
# Le chiavi sconosciute vengono ignorate, quindi si possono aggiungere note.

# --- Chi produce. Questi dati vanno in etichetta per obbligo di legge:
# --- il Reg. UE 1169/2011 vuole nome o ragione sociale e indirizzo
# --- dell'operatore responsabile delle informazioni sull'alimento.

RagioneSociale = Sakura Sushi di Mario Rossi
Indirizzo = Via Giuseppe Verdi 14
Cap = 20121
Citta = Milano
Provincia = MI
PartitaIva = 01234567890

# Il marchio di identificazione (il "bollo CE") dello stabilimento
# registrato. Lasciare vuoto se il negozio non ne ha uno.
MarchioIdentificazione = IT 1234 CE

Telefono = 02 1234567

# --- Il supporto, in millimetri.
# --- 70 x 50 e' il formato su cui il programma e' tarato: ci stanno tutte
# --- le informazioni obbligatorie e il codice a barre. Scendendo sotto,
# --- il programma stringe da solo i caratteri e avvisa se non ci sta.

LarghezzaMm = 70,0
AltezzaMm = 50,0
MargineMm = 2,0

# --- Il lotto.
# --- Compatto:  L261105-03   prefisso, anno/mese/giorno, progressivo
# --- Giuliano:  L26309-03    prefisso, anno, giorno dell'anno, progressivo

PrefissoLotto = L
FormatoLotto = Compatto

# --- Il codice a barre: un GS1-128 che porta scadenza e lotto, cosi' chi
# --- lo legge in cassa o in magazzino ha la tracciabilita' senza digitare.
# --- Mettere dentro anche la data di produzione allunga il codice di circa
# --- un quarto: conviene solo su etichette larghe.

MostraBarcode = SI
BarcodeIncludeDataProduzione = NO

# Larghezza minima di un modulo. Sotto questa misura il codice si stampa
# ma i lettori fanno fatica. 0,19 mm sono circa un modulo e mezzo a 203 dpi,
# che e' la risoluzione delle stampanti termiche piu' diffuse.
ModuloBarcodeMinimoMm = 0,19

# --- Testi fissi.

NomeFont = Arial

# L'avviso per il pesce destinato al consumo crudo. Viene stampato solo sui
# prodotti che hanno PesceCrudo = SI nel catalogo.
#
# Questa e' la forma breve, che sta su un'etichetta da 70 mm. Su supporti
# piu' grandi, o se lo chiede l'ASL, si puo' usare la dicitura estesa:
#
#   Prodotto a base di pesce destinato a essere consumato crudo, sottoposto
#   a trattamento di bonifica preventiva conforme alle prescrizioni del
#   Reg. CE 853/2004, Allegato III, Sezione VIII, Capitolo 3, lettera D,
#   punto 3.
#
# Il testo va su una riga sola, senza andare a capo.

AvvisoAbbattimento = Prodotto a base di pesce consumato crudo, sottoposto a bonifica preventiva ai sensi del Reg. CE 853/2004.
